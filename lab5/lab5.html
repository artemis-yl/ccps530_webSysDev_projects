<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">

    <!--External CSS, on top of Bootstrap. Therefore after Bootstrap line-->
    <link rel="stylesheet" href="lab5.css">

    <title>CCPS530 Lab 5</title>
</head>

<body>
    <!-- NO JavaScript for Bootstrap-->
    <!-- jQuery JavaScript -->
    <script src="https://ajax.aspnetcdn.com/ajax/jQuery/jquery-3.2.1.min.js"></script>

    <!-- custom JavaScript/jQuery -->
    <script src="lab5.js"></script>

    <!-- Requirement #3 : "You must use the Bootstrap navbar"-->
    <nav class="navbar navbar-expand navbar-dark navbar-custom">
        <!-- Requirement #2 : "Name clearly on page"-->
        <span class="navbar-brand ">Artemis Lee</span>
        <span class="navbar-item mx-auto">Lab 5 Portfolio Sample</span>
    </nav>
    <!-- Requirement #4.1 : "Under the navbar, you must have a div section..."-->  
     <!-- Used container/grid to handle overall responsiveness --> 
     <div class="container-fluid">
        <div class="row justify-content-center ">
                <div class="col-md-8 text-center">
                    <div class="slideshow-container">
                        <div class="slide">
                            <!-- note: img-fluid ensures it scales-->
                             <!-- note: needs a default src for HTML5 compliance-->
                            <img class="slide-image img-fluid" src="image1.PNG" alt="Slideshow Image">
                            <!-- Requirement #5.1 : "Under the images, you need to have a description."-->
                            <p class="slide-caption">Description</p>
                        </div>

                    </div>
                </div>
            </div>
            <div class="row justify-content-center ">
                <div class="col-md-8 text-center">
                    <h1>Portfolio: Four Sample CAD Images</h1>
                </div>
            </div>
     </div>

    </body>


</html>
